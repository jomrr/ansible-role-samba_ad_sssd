---
# role: samba_ad_sssd
# file: tasks/configure.yml

- name: SAMBA_AD_SSSD | Ensure the Kerberos configuration include directory exists
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/krb5.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: SAMBA_AD_SSSD | Configure the system Kerberos realm and keytab
  become: true
  become_user: root
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify:
    - restart sssd
    - apply computer policies

- name: SAMBA_AD_SSSD | Create SSSD configuration directories
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __samba_ad_sssd_directory }}"
    state: directory
    owner: root
    group: "{{ __samba_ad_sssd_config_group }}"
    mode: '0750'
  loop:
    - /etc/sssd
    - /etc/sssd/conf.d
  loop_control:
    loop_var: __samba_ad_sssd_directory
    label: "{{ __samba_ad_sssd_directory }}"

- name: SAMBA_AD_SSSD | Configure and validate SSSD
  become: true
  become_user: root
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: "{{ __samba_ad_sssd_config_group }}"
    mode: '0640'
    backup: true
    validate: "{{ __samba_ad_sssd_validate }}"
  no_log: "{{ samba_ad_sssd_config_no_log }}"
  notify: restart sssd
