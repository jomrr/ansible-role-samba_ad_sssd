---
# role: sssd
# file: tasks/main.yml

- name: SSSD | Load platform settings
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', __sssd_platform_files) }}"
  vars:
    __sssd_platform_files:
      files:
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: SSSD | Configure system Kerberos
  ansible.builtin.include_role:
    name: jomrr.krb5
  vars:
    krb5_realm: "{{ sssd_realm }}"

- name: SSSD | Configure native SSSD authentication
  ansible.builtin.include_role:
    name: jomrr.pam
  vars:
    pam_provider: sssd

- name: SSSD | Install AD login components
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __sssd_packages }}"
    state: present

- name: SSSD | Configure domain identity
  ansible.builtin.import_tasks: configure.yml

- name: SSSD | Read machine keytab principals
  become: true
  become_user: root
  ansible.builtin.command:
    argv:
      - klist
      - -k
      - '{{ sssd_keytab }}'
  register: __sssd_keytab_principals
  check_mode: false
  changed_when: false
  failed_when: __sssd_keytab_principals.rc not in [0, 1]

- name: SSSD | Join the Active Directory domain
  become: true
  become_user: root
  ansible.builtin.command:
    argv: >-
      {{ ['adcli', 'join',
          '--domain=' ~ (sssd_realm | upper),
          '--login-user=' ~ sssd_join_username,
          '--host-keytab=' ~ sssd_keytab,
          '--stdin-password']
         + (['--domain-controller=' ~ sssd_server] if sssd_server else [])
         + (['--host-fqdn=' ~ sssd_host_fqdn] if sssd_host_fqdn else [])
         + (['--domain-ou=' ~ sssd_computer_ou] if sssd_computer_ou else []) }}
    stdin: '{{ sssd_join_password }}'
    expand_argument_vars: false
  changed_when: true
  when: >-
    sssd_force_join or __sssd_keytab_principals.rc == 1 or
    __sssd_keytab_principals.stdout.split()
    | select('match', '(?i)^(?:host(?:/.*)?|[^/]+\\$)@' ~ (sssd_realm | regex_escape) ~ '$')
    | list | length == 0
  no_log: true
  notify: restart sssd

- name: SSSD | Activate domain identity
  ansible.builtin.meta: flush_handlers

- name: SSSD | Enable and start SSSD
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: sssd
    enabled: true
    state: started
