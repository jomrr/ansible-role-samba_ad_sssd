---
# role: samba_ad_sssd
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Join AD and configure SSSD, NSS, PAM, and Linux computer GPOs.
    options:
      samba_ad_sssd_realm:
        type: str
        description: AD DNS domain and Kerberos realm; must remain stable after joining.
        required: true
      samba_ad_sssd_join_username:
        type: str
        description: Account delegated permission to join computers to the domain.
        default: Administrator
      samba_ad_sssd_join_password:
        type: str
        description: Join password from a secret store; needed for the initial SSSD/GPO
          setup or forced rejoin.
        no_log: true
      samba_ad_sssd_server:
        type: str
        description: DC hostname for initial joins; empty uses adcli discovery and the DNS
          realm for Samba. Runtime DC selection uses domain_options.ad_server.
        default: ''
      samba_ad_sssd_computer_ou:
        type: str
        description: LDAP DN of the computer OU; empty uses the domain default.
        default: ''
      samba_ad_sssd_host_fqdn:
        type: str
        description: Stable fully qualified machine hostname shared by adcli and SSSD.
        default: '{{ ansible_facts.fqdn | lower }}'
      samba_ad_sssd_keytab:
        type: path
        description: Machine keytab used by adcli, SSSD and the system Kerberos configuration;
          its parent directory must exist.
        default: /etc/krb5.keytab
      samba_ad_sssd_force_join:
        type: bool
        description: Rejoin on every run; enable only for deliberate machine account repair.
        default: false
      samba_ad_sssd_id_mapping:
        type: str
        description: rfc2307 reads centrally assigned POSIX IDs; autorid_compat enables
          SSSD algorithmic mapping with autorid compatibility.
        choices:
          - rfc2307
          - autorid_compat
        default: rfc2307
      samba_ad_sssd_sssd_options:
        type: dict
        description: Native [sssd] options, for example domain_resolution_order. Domains
          and services are role-owned.
        default: {}
      samba_ad_sssd_domain_options:
        type: dict
        description: Native AD domain options with scalar values and comma-separated strings
          for lists. Role-owned provider, identity, keytab and mapping settings take precedence.
        default:
          access_provider: ad
          ad_gpo_access_control: enforcing
          enumerate: false
          cache_credentials: true
          use_fully_qualified_names: true
          fallback_homedir: /home/%d/%u
          default_shell: /bin/bash
      samba_ad_sssd_nss_options:
        type: dict
        description: Native [nss] responder options with scalar values, for example filter_users
          or filter_groups.
        default: {}
      samba_ad_sssd_pam_options:
        type: dict
        description: Native [pam] responder options with scalar values, for example offline_credentials_expiration.
        default: {}
      samba_ad_sssd_config_no_log:
        type: bool
        description: Redact template output and diffs when native SSSD options contain secrets.
        default: false
      samba_ad_sssd_mkhomedir:
        type: bool
        description: Enable native PAM home directory creation on login; disabling removes
          the managed PAM feature and preserves homes.
        default: true
      samba_ad_sssd_authselect_features:
        type: list
        description: Additional features of the Red Hat sssd profile; with-mkhomedir is
          controlled by mkhomedir.
        elements: str
        default: []
      samba_ad_sssd_authselect_force:
        type: bool
        description: Allow authselect to replace existing unmanaged PAM/NSS files using
          its native backup mechanism.
        default: false
      samba_ad_sssd_gpo_workgroup:
        type: str
        description: AD NetBIOS domain for Samba GPO access; override when it differs from
          the realm's first label.
        default: '{{ samba_ad_sssd_realm.split(".")[0] | upper }}'
      samba_ad_sssd_idmap_default_range:
        type: str
        description: Writable Samba fallback range for BUILTIN and unmapped domains; must
          not overlap the AD range.
        default: 65536-69999
      samba_ad_sssd_idmap_range:
        type: str
        description: Samba AD backend filter for existing RFC2307 IDs; does not set SSSD
          min_id or max_id.
        default: 70000-99999
      samba_ad_sssd_smb_min_protocol:
        type: str
        description: Minimum SMB dialect for Samba connections to domain controllers, including
          IPC; SMB3 currently aliases SMB3_11, and the maximum stays negotiated.
        default: SMB3
      samba_ad_sssd_smb_signing:
        type: str
        description: Samba client signing policy for SMB and IPC connections; the GPO client
          also enforces signing itself.
        choices:
          - default
          - desired
          - required
          - disabled
        default: required
      samba_ad_sssd_smb_encryption:
        type: str
        description: Samba client encryption policy for SMB connections, including SYSVOL
          computer policy downloads.
        choices:
          - default
          - 'off'
          - if_required
          - desired
          - required
        default: required
      samba_ad_sssd_samba_ldap_sasl_wrapping:
        type: str
        description: SASL protection for Samba LDAP connections; seal provides signing and
          encryption independently of SSSD.
        choices:
          - plain
          - sign
          - seal
        default: seal
      samba_ad_sssd_gpo_refresh_enabled:
        type: bool
        description: Apply computer GPOs automatically; disabling retains the client and
          synchronized machine credentials.
        default: true
      samba_ad_sssd_gpo_refresh_interval:
        type: str
        description: Interval between automatic computer policy updates, using systemd time
          span syntax.
        default: 90min
      samba_ad_sssd_gpo_randomized_delay:
        type: str
        description: Maximum random delay added to scheduled policy updates, using systemd
          time span syntax.
        default: 30min
