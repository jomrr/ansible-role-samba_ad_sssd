---
# role: samba_ad_sssd
# file: defaults/main.yml

# AD DNS domain and Kerberos realm; must remain stable after joining.
# samba_ad_sssd_realm: AD.EXAMPLE.COM

# Account delegated permission to join computers to the domain.
samba_ad_sssd_join_username: Administrator

# Join password from a secret store; needed for the initial SSSD/GPO setup or forced rejoin.
# samba_ad_sssd_join_password: '{{ vault_ad_join_password }}'

# DC hostname for initial joins; empty uses adcli discovery and the DNS realm for Samba.
# Runtime DC selection uses domain_options.ad_server.
samba_ad_sssd_server: ''

# LDAP DN of the computer OU; empty uses the domain default.
samba_ad_sssd_computer_ou: ''

# Stable fully qualified machine hostname shared by adcli and SSSD.
samba_ad_sssd_host_fqdn: '{{ ansible_facts.fqdn | lower }}'

# Machine keytab used by adcli and SSSD; its parent directory must exist.
samba_ad_sssd_keytab: /etc/krb5.keytab

# Rejoin on every run; enable only for deliberate machine account repair.
samba_ad_sssd_force_join: false

# rfc2307 reads centrally assigned POSIX IDs; autorid_compat enables SSSD algorithmic mapping with
# autorid compatibility.
samba_ad_sssd_id_mapping: rfc2307

# Native [sssd] options, for example domain_resolution_order. Domains and services are role-owned.
samba_ad_sssd_sssd_options: {}

# Native AD domain options with scalar values and comma-separated strings for lists. Role-owned
# provider, identity, keytab and mapping settings take precedence.
samba_ad_sssd_domain_options:
  access_provider: ad
  ad_gpo_access_control: enforcing
  enumerate: false
  cache_credentials: true
  use_fully_qualified_names: true
  fallback_homedir: /home/%d/%u
  default_shell: /bin/bash

# Native [nss] responder options with scalar values, for example filter_users or filter_groups.
samba_ad_sssd_nss_options: {}

# Native [pam] responder options with scalar values, for example offline_credentials_expiration.
samba_ad_sssd_pam_options: {}

# Redact template output and diffs when native SSSD options contain secrets.
samba_ad_sssd_config_no_log: false

# Enable native PAM home directory creation on login; disabling removes the managed PAM feature and
# preserves homes.
samba_ad_sssd_mkhomedir: true

# Additional features of the Red Hat sssd profile; with-mkhomedir is controlled by mkhomedir.
samba_ad_sssd_authselect_features: []

# Allow authselect to replace existing unmanaged PAM/NSS files using its native backup mechanism.
samba_ad_sssd_authselect_force: false

# AD NetBIOS domain for Samba GPO access; override when it differs from the realm's first label.
samba_ad_sssd_gpo_workgroup: '{{ samba_ad_sssd_realm.split(".")[0] | upper }}'

# Writable Samba fallback range for BUILTIN and unmapped domains; must not overlap the AD range.
samba_ad_sssd_idmap_default_range: 65536-69999

# Samba AD backend filter for existing RFC2307 IDs; does not set SSSD min_id or max_id.
samba_ad_sssd_idmap_range: 70000-99999

# Minimum SMB dialect for Samba connections to domain controllers, including IPC; SMB3 currently aliases
# SMB3_11, and the maximum stays negotiated.
samba_ad_sssd_smb_min_protocol: SMB3

# Samba client signing policy for SMB and IPC connections; the GPO client also enforces signing itself.
samba_ad_sssd_smb_signing: required

# Samba client encryption policy for SMB connections, including SYSVOL computer policy downloads.
samba_ad_sssd_smb_encryption: required

# SASL protection for Samba LDAP connections; seal provides signing and encryption independently of SSSD.
samba_ad_sssd_samba_ldap_sasl_wrapping: seal

# Apply computer GPOs automatically; disabling retains the client and synchronized machine credentials.
samba_ad_sssd_gpo_refresh_enabled: true

# Interval between automatic computer policy updates, using systemd time span syntax.
samba_ad_sssd_gpo_refresh_interval: 90min

# Maximum random delay added to scheduled policy updates, using systemd time span syntax.
samba_ad_sssd_gpo_randomized_delay: 30min
