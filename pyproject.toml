[project]
name = "samba_ad_sssd"
version = "0.0.0"
description = "Join Linux systems to Active Directory with SSSD, RFC2307 identities, and native PAM integration."
authors = ["Jonas Mauer"]
license = "MIT"
keywords = ["samba", "activedirectory", "sssd", "authentication", "rfc2307"]
repository = "https://github.com/jomrr/ansible-role-samba_ad_sssd"

[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
branch = "main"
commit_message = "build(release): version {version}"
major_on_zero = true
upload_to_pypi = false
upload_to_vcs_release = true
tag_format = "v{version}"
version_toml = [
    "pyproject.toml:project.version",
]

[tool.tox]
envlist = ["lint"]

[tool.tox.env.lint]
description = "Lint code"
skip_install = true
deps = ["ansible-lint"]
commands = [["ansible-lint", "--offline"]]
