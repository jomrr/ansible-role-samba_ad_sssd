---
# role: sssd
# file: molecule/resources/playbooks/side_effect.yml

- name: SSSD | Verify native option and home policy updates
  hosts: sssd_members
  gather_facts: true
  tasks:

    - name: SSSD | Exercise commented NSS sources before restoring domain lookups
      become: true
      become_user: root
      ansible.builtin.replace:
        path: /etc/nsswitch.conf
        regexp: '^(passwd|group):.*$'
        replace: '\1: files # sss will be restored by the role'
      when: ansible_facts.os_family in ['Debian', 'Suse']

    - name: SSSD | Read the keytab before a forced rejoin
      become: true
      become_user: root
      ansible.builtin.stat:
        path: '{{ sssd_keytab }}'
        checksum_algorithm: sha256
      register: __sssd_keytab_before_rejoin

    - name: SSSD | Rejoin with short names, restore native lookups and disable home creation
      ansible.builtin.include_role:
        name: '{{ lookup(''ansible.builtin.env'', ''MOLECULE_PROJECT_DIRECTORY'') }}'
      vars:
        pam_mkhomedir: false
        sssd_force_join: true
        sssd_domain_options:
          ad_server: dc-sssd.ad.sssd.test
          krb5_server: dc-sssd.ad.sssd.test
          access_provider: ad
          ad_gpo_access_control: enforcing
          use_fully_qualified_names: false
          enumerate: false
          ldap_idmap_range_min: 10000
          ldap_idmap_range_max: 60000
          ldap_idmap_range_size: 10000
        sssd_sssd_options:
          domain_resolution_order: ad.sssd.test
        sssd_pam_options:
          offline_credentials_expiration: 7

    - name: SSSD | Read the keytab after the forced rejoin
      become: true
      become_user: root
      ansible.builtin.stat:
        path: '{{ sssd_keytab }}'
        checksum_algorithm: sha256
      register: __sssd_keytab_after_rejoin

    - name: SSSD | Verify that forcing the join replaces machine credentials
      ansible.builtin.assert:
        that: __sssd_keytab_before_rejoin.stat.checksum != __sssd_keytab_after_rejoin.stat.checksum

    - name: SSSD | Check machine trust after the forced rejoin
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - kinit
          - -k
          - -t
          - '{{ sssd_keytab }}'
          - -c
          - MEMORY:sssd-molecule-machine-trust
          - '{{ inventory_hostname | upper }}$@{{ sssd_realm | upper }}'
        expand_argument_vars: false
      changed_when: false

    - name: SSSD | Resolve a short domain username
      ansible.builtin.getent:
        database: passwd
        key: writer

    - name: SSSD | Open a session without automatic home creation
      become: true
      become_user: root
      ansible.builtin.command:
        argv: [sssctl, user-checks, --action=open, --service=login, reader]
      environment:
        LC_ALL: C
      register: __sssd_nohome_session
      changed_when: false
      failed_when: >-
        __sssd_nohome_session.rc != 0 or
        'pam_open_session: Success' not in __sssd_nohome_session.stderr

    - name: SSSD | Inspect the disabled home creation result
      become: true
      become_user: root
      ansible.builtin.stat:
        path: /home/reader
      register: __sssd_nohome

    - name: SSSD | Verify no home was created after disabling the feature
      ansible.builtin.assert:
        that: not __sssd_nohome.stat.exists
